name: Relay SSH Android Build

on:
  push:
    branches:
      - relay-ssh-kotlin
    paths:
      - "RelaySSH/**"
      - ".github/workflows/relay-ssh-kotlin.yml"
  pull_request:
    branches:
      - ace-injector-source
    paths:
      - "RelaySSH/**"
      - ".github/workflows/relay-ssh-kotlin.yml"

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Relay SSH debug APK
        working-directory: RelaySSH
        run: bash ./gradlew --no-daemon assembleDebug

      - name: Upload Relay SSH debug APK
        uses: actions/upload-artifact@v4
        with:
          name: relay-ssh-debug-apk
          path: RelaySSH/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
