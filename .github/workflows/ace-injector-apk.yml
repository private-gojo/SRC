name: Build ACE Injector APK

on:
  push:
    branches:
      - ace-injector-source
    paths:
      - "ACE-INJECTOR/**"
      - ".github/workflows/ace-injector-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17 for Android SDK tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-30" "build-tools;30.0.2"

      - name: Set up JDK 11 for legacy Gradle build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Build debug APK
        working-directory: ACE-INJECTOR
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ACE-Injector-debug-apk
          path: ACE-INJECTOR/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
